pre-commit:
  commands:
    eslintBackend:
      glob: "./apps/tiqo-backend/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm eslint {staged_files}
      stage_fixed: true
    formatBackend:
      glob: "./apps/tiqo-backend/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    eslintFrontend:
      glob: "./apps/tiqo-frontend/*.{vue,ts}"
      run: pnpm eslint {staged_files}
      stage_fixed: true
